name: securo

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_securo_pass}
      POSTGRES_DB: ${POSTGRES_DB:-securo}
    volumes:
      - securo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_securo_pass}@db:5432/${POSTGRES_DB:-securo}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-altere-esta-chave-secreta-em-producao}
      DEBUG: "false"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      TESOURO_DIRETO_ENABLED: "true"
      TRUSTED_PROXY_HOPS: "1"
      STORAGE_LOCAL_PATH: /app/data/attachments
      AGENTS_KNOWLEDGE_STORAGE_PATH: /app/data/agent_knowledge
      AGENTS_ENABLED: "false"
    volumes:
      - securo_attachments:/app/data/attachments
      - securo_knowledge:/app/data/agent_knowledge
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      - backend

volumes:
  securo_pgdata:
  securo_attachments:
  securo_knowledge:
